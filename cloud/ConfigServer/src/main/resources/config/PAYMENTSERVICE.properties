server.port=5009

#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/airline?serverTimezone=UTC
spring.datasource.url=jdbc:postgresql://localhost:5432/airline
spring.datasource.username=ankit
spring.datasource.password=ankit
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ================= PAYMENT CONFIG =================

razorpay.currency=INR
razorpay.base-url=https://api.razorpay.com
razorpay.callback-url=http://localhost:5009/api/payments/callback/razorpay

# Separate secret used only to validate Razorpay webhook requests
razorpay.webhook-secret=my-airline-webhook-secret



# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.airlineportal.event.*



eureka.client.service-url.defaultZone=http://localhost:8761/eureka

