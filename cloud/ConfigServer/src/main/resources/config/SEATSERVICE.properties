server.port=5011

#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/airline?serverTimezone=UTC
spring.datasource.url=jdbc:postgresql://localhost:5432/airline
spring.datasource.username=ankit
spring.datasource.password=ankit
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from-name=Airline Management
app.frontent.url=http://localhost:3000



resilience4j.retry.instances.flightService.max-attempts=3
resilience4j.retry.instances.flightService.wait-duration=1s

resilience4j.circuitbreaker.instances.flightService.sliding-window-size=10
resilience4j.circuitbreaker.instances.flightService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.flightService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.flightService.wait-duration-in-open-state=10s



