
# Integration-test database
spring.datasource.url=jdbc:h2:mem:seatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recreate the schema for each test context
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Avoid connecting to infrastructure not needed by these tests
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.cloud.openfeign.enabled=false

# Disable Elasticsearch repositories if they are not needed by SeatService tests
spring.data.elasticsearch.repositories.enabled=false



